# GitHub Actions 要求使用 YAML；仅验证源码与构建，不自动公开发行。
name: CLI CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: go build -trimpath -o bin/ .
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --version 0.1.0-rc.1 --output dist/candidate
      - uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-${{ github.sha }}
          path: dist/candidate/
          retention-days: 7
