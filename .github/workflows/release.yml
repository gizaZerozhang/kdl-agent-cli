name: CLI Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ${{ contains(github.ref_name, '-beta.') && 'ubuntu-22.04' || 'macos-15' }}
    environment: github-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查版本、验收记录与签名配置
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: node scripts/release-policy.cjs "$GITHUB_REF_NAME" --require-signing
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: go test -race ./...
      - run: go vet ./...
      - run: python scripts/release-assets.py preflight
      - uses: goreleaser/goreleaser-action@v6
        env:
          MACOS_SIGN_P12: ${{ !contains(github.ref_name, '-beta.') && secrets.MACOS_SIGN_P12 || '' }}
          MACOS_SIGN_PASSWORD: ${{ !contains(github.ref_name, '-beta.') && secrets.MACOS_SIGN_PASSWORD || '' }}
          MACOS_NOTARY_KEY: ${{ !contains(github.ref_name, '-beta.') && secrets.MACOS_NOTARY_KEY || '' }}
          MACOS_NOTARY_KEY_ID: ${{ !contains(github.ref_name, '-beta.') && secrets.MACOS_NOTARY_KEY_ID || '' }}
          MACOS_NOTARY_ISSUER_ID: ${{ !contains(github.ref_name, '-beta.') && secrets.MACOS_NOTARY_ISSUER_ID || '' }}
        with:
          version: v2.18.1
          args: release --clean --skip=publish --timeout=60m
      - run: python scripts/release-assets.py collect dist dist/candidate
      - name: 验证 macOS 签名与公证
        if: ${{ !contains(github.ref_name, '-beta.') }}
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: python scripts/verify-macos.py dist/candidate
      - run: npm run release:prepare -- dist/candidate dist/npm
      - name: 固定 npm 候选与校验
        run: |
          cp dist/npm/*.tgz dist/candidate/npm-package.tgz
          cd dist/candidate
          shasum -a 256 npm-package.tgz > NPM-SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate/
          retention-days: 30
  verify:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: go test ./...
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate
      - run: node -e 'require("fs").mkdirSync("dist/unpacked",{recursive:true})'
      - run: tar -xzf dist/candidate/npm-package.tgz -C dist/unpacked
      - run: node scripts/smoke-candidate.cjs dist/unpacked/package dist/candidate
  draft:
    needs: verify
    runs-on: ubuntu-22.04
    environment: github-release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-release.cjs dist/candidate
      - name: 发布固定候选并派发 npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--prerelease)
          if [[ "$GITHUB_REF_NAME" != *-beta.* ]]; then
            release_flags=(--prerelease=false --latest)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --dir dist/existing
            node scripts/verify-release.cjs dist/existing
          else
            gh release create "$GITHUB_REF_NAME" dist/candidate/* --verify-tag --draft "${release_flags[@]}" --title "快代理 CLI $GITHUB_REF_NAME" --notes-file dist/candidate/release-notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "${release_flags[@]}"
          gh workflow run publish-npm.yml --ref "$GITHUB_REF_NAME" -f tag="$GITHUB_REF_NAME"
