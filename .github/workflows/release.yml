name: CLI Beta Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查 tag 与版本，稳定版暂不开放
        run: |
          node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version || !/^\d+\.\d+\.\d+-beta\.\d+$/.test(p.version)) throw Error("版本不一致或稳定版签名与业务验收尚未接入")'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: go test -race ./...
      - run: go vet ./...
      - run: python scripts/release-assets.py preflight
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.1
          args: release --clean --skip=publish
      - run: python scripts/release-assets.py collect dist dist/candidate
      - run: npm run release:prepare -- dist/candidate dist/npm
      - name: 固定 npm 候选与校验
        run: |
          cp dist/npm/*.tgz dist/candidate/npm-package.tgz
          cd dist/candidate
          sha256sum npm-package.tgz > NPM-SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate/
          retention-days: 30
  verify:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: go test ./...
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate
      - run: node -e 'require("fs").mkdirSync("dist/unpacked",{recursive:true})'
      - run: tar -xzf dist/candidate/npm-package.tgz -C dist/unpacked
      - run: node scripts/smoke-candidate.cjs dist/unpacked/package dist/candidate
  draft:
    needs: verify
    runs-on: ubuntu-22.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/candidate
      - name: 创建固定候选 Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/candidate/* --verify-tag --draft --prerelease --title "快代理 CLI $GITHUB_REF_NAME" --notes-file dist/candidate/release-notes.md
